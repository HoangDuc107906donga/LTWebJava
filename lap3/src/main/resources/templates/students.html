<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sinh viên</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
        }
        /* Sidebar layout */
        .wrapper {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 240px;
            background-color: #1a1d20;
            color: #fff;
            flex-shrink: 0;
        }
        .sidebar .brand {
            padding: 20px;
            font-size: 1.25rem;
            font-weight: 600;
            border-bottom: 1px solid #2d3238;
        }
        .sidebar .nav-link {
            color: #a0aec0;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #fff;
            background-color: #2d3748;
        }
        .main-content {
            flex-grow: 1;
            padding: 30px;
        }
        /* Table & Card styles */
        .card-custom {
            border: none;
            border-radius: 8px;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            background-color: #fff;
        }
        .table th {
            font-weight: 600;
            color: #4a5568;
            border-bottom-width: 1px;
            background-color: #f8fafc;
            white-space: nowrap;
        }
        .table td {
            vertical-align: middle;
            color: #2d3748;
        }
        .btn-action {
            padding: 4px 10px;
            font-size: 0.85rem;
            border-radius: 4px;
        }
        .sort-icon {
            font-size: 0.75rem;
            color: #cbd5e0;
            margin-left: 4px;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="brand">
            University Training
        </div>
        <div class="nav flex-column mt-3">
            <a th:href="@{/students}" class="nav-link active">
                <i class="fa-solid fa-users"></i> Sinh viên
            </a>
            <a href="#" class="nav-link">
                <i class="fa-solid fa-book"></i> Học phần
            </a>
            <a href="#" class="nav-link">
                <i class="fa-solid fa-building"></i> Phòng học
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header / Breadcrumb -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold m-0 text-dark">Quản lý sinh viên</h3>
            <div class="text-muted fs-6">
                Home / <span class="text-dark">Sinh viên</span>
            </div>
        </div>

        <!-- Main Card Container -->
        <div class="card card-custom p-4">
            <!-- Top Bar: Title & Add Button -->
            <div class="d-flex justify-content-between align-items-center pb-3 border-bottom mb-4">
                <h5 class="m-0 fw-semibold text-secondary">
                    <i class="fa-solid fa-users-gear me-2"></i>Danh sách sinh viên
                </h5>
                <a th:href="@{/students/add}" class="btn btn-primary px-3">
                    <i class="fa-solid fa-circle-plus me-1"></i> Thêm sinh viên
                </a>
            </div>

            <!-- Search Form -->
            <form th:action="@{/students}" method="get" class="row g-2 mb-4">
                <div class="col-md-5">
                    <input type="text" 
                           name="keyword" 
                           th:value="${keyword}" 
                           class="form-control" 
                           placeholder="Tìm mã SV, họ tên, email...">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-magnifying-glass me-1"></i> Tìm kiếm
                    </button>
                </div>
            </form>

            <!-- Table -->
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>STT <i class="fa-solid fa-sort sort-icon"></i></th>
                            <th>Mã sinh viên <i class="fa-solid fa-sort sort-icon"></i></th>
                            <th>Họ và tên <i class="fa-solid fa-sort sort-icon"></i></th>
                            <th>Email <i class="fa-solid fa-sort sort-icon"></i></th>
                            <th>Số điện thoại <i class="fa-solid fa-sort sort-icon"></i></th>
                            <th>Lớp <i class="fa-solid fa-sort sort-icon"></i></th>
                            <th class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Lặp danh sách sinh viên -->
                        <tr th:each="student, iterStat : ${students}">
                            <!-- Số thứ tự -->
                            <td class="fw-semibold text-muted" th:text="${iterStat.count}">1</td>
                            <td th:text="${student.studentCode}">SV001</td>
                            <td class="fw-semibold" th:text="${student.fullName}">Nguyễn Văn A</td>
                            <td th:text="${student.email}">a@gmail.com</td>
                            <td th:text="${student.phone}">0901234567</td>
                            <td th:text="${student.className}">C2024A</td>
                            <td class="text-center">
                                <!-- Nút Xem Chi Tiết (Đã bổ sung cho bạn) -->
                                <a th:href="@{/students/detail/{id}(id=${student.id})}" 
                                   class="btn btn-info btn-action text-white me-1" 
                                   title="Chi tiết">
                                    <i class="fa-solid fa-eye"></i> Chi tiết
                                </a>
                                <!-- Nút Sửa -->
                                <a th:href="@{/students/edit/{id}(id=${student.id})}" 
                                   class="btn btn-warning btn-action text-white me-1" 
                                   title="Sửa">
                                    <i class="fa-solid fa-pen"></i> Sửa
                                </a>
                                <!-- Nút Xóa -->
                                <a th:href="@{/students/delete/{id}(id=${student.id})}" 
                                   class="btn btn-danger btn-action" 
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa sinh viên này không?');" 
                                   title="Xóa">
                                    <i class="fa-solid fa-trash"></i> Xóa
                                </a>
                            </td>
                        </tr>
                        <!-- Trường hợp danh sách rỗng -->
                        <tr th:if="${#lists.isEmpty(students)}">
                            <td colspan="7" class="text-center text-muted py-4">Không tìm thấy sinh viên nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">DANH SÁCH SINH VIÊN</h3>
        </div>
        <div class="card-body">
            <!-- Form Tìm kiếm -->
            <form th:action="@{/students}" method="get" class="row g-3 mb-4">
                <div class="col-auto">
                    <input type="text" name="keyword" class="form-control" placeholder="Nhập tên tìm kiếm..." th:value="${keyword}">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Tìm kiếm</button>
                    <a th:href="@{/students}" class="btn btn-secondary">Làm mới</a>
                </div>
            </form>

            <!-- Bảng Dữ liệu -->
            <table class="table table-bordered table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Họ tên</th>
                        <th>Giới tính</th>
                        <th>Tuổi</th>
                        <th>Email</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="student : ${students}">
                        <td th:text="${student.id}"></td>
                        <td th:text="${student.name}"></td>
                        <td th:text="${student.gender}"></td>
                        <td th:text="${student.age}"></td>
                        <td th:text="${student.email}"></td>
                        <td>
                            <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-info btn-sm text-white">Xem chi tiết</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="6" class="text-center text-muted">Không tìm thấy sinh viên nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>

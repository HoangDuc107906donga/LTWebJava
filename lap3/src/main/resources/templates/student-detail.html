<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-info text-white">
            <h4 class="mb-0">THÔNG TIN CHI TIẾT SINH VIÊN</h4>
        </div>
        <div class="card-body" th:if="${student != null}">
            <ul class="list-group list-group-flush">
                <li class="list-group-item"><strong>Mã SV (ID):</strong> <span th:text="${student.id}"></span></li>
                <li class="list-group-item"><strong>Họ và tên:</strong> <span th:text="${student.name}"></span></li>
                <li class="list-group-item"><strong>Giới tính:</strong> <span th:text="${student.gender}"></span></li>
                <li class="list-group-item"><strong>Tuổi:</strong> <span th:text="${student.age}"></span></li>
                <li class="list-group-item"><strong>Email:</strong> <span th:text="${student.email}"></span></li>
            </ul>
        </div>
        <div class="card-body text-center" th:if="${student == null}">
            <p class="text-danger">Không tìm thấy thông tin sinh viên này!</p>
        </div>
        <div class="card-footer text-end">
            <a th:href="@{/students}" class="btn btn-secondary">Quay lại danh sách</a>
        </div>
    </div>
</div>
</body>
</html>
